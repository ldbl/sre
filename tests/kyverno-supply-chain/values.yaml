# Namespace labels for the policies' namespaceSelector (the CLI has no cluster to read them from).
apiVersion: cli.kyverno.io/v1alpha1
kind: Values
namespaceSelector:
  - name: develop
    labels: {kubernetes.io/metadata.name: develop}
  - name: staging
    labels: {kubernetes.io/metadata.name: staging}
  - name: production
    labels: {kubernetes.io/metadata.name: production}
  - name: observability
    labels: {kubernetes.io/metadata.name: observability}
