# Resources for tests/kyverno-supply-chain.test.sh - real images, pinned by digest, so the verdicts
# cannot change under the test:
#   backend  sha256:c531df33871e88a2fc8c51ad59ee0ec14e9cee4b65be628a98ef342dc017b7da - cosign v3 (Sigstore bundle), signed by backend's build.yml on main, SPDX SBOM
#   frontend sha256:2d452580dffb2a3649d335d6a9f82c36800814023ee8d7be9e0ebc23fcb8a0c0 - cosign v2 (.sig), signed by frontend's build.yml on develop, SPDX SBOM
#   k8s-ai-monitor sha256:91b7bb5d14deb880558ee5a78478525f4575a8fc549bcfe7e72c8f85486df3c5 - built before k8s-ai-monitor#11: no signature at all
#   frontend sha256:3ac8955f8bb18eebce622bfda77fa415aba2ed009470dc154e087bef5d1390f4 - mixed formats: signature and
#     SBOM as cosign v2 (.sig/.att), GitHub's SLSA provenance as an OCI referrer. With a referrer present,
#     the verifier reads only the referrers: the SBOM is never found. Signed, and still refused.
# The busybox container in "signed-with-foreign-image" is not ours: the policy must ignore it.
apiVersion: v1
kind: Pod
metadata: {name: backend-signed, namespace: develop}
spec: {containers: [{name: app, image: "ghcr.io/safeops-course/backend@sha256:c531df33871e88a2fc8c51ad59ee0ec14e9cee4b65be628a98ef342dc017b7da"}]}
---
apiVersion: v1
kind: Pod
metadata: {name: frontend-signed-legacy-format, namespace: production}
spec: {containers: [{name: app, image: "ghcr.io/safeops-course/frontend@sha256:2d452580dffb2a3649d335d6a9f82c36800814023ee8d7be9e0ebc23fcb8a0c0"}]}
---
apiVersion: v1
kind: Pod
metadata: {name: signed-with-foreign-image, namespace: develop}
spec:
  containers:
    - {name: app, image: "ghcr.io/safeops-course/backend@sha256:c531df33871e88a2fc8c51ad59ee0ec14e9cee4b65be628a98ef342dc017b7da"}
    - {name: sidecar, image: "busybox:1.36"}
---
apiVersion: v1
kind: Pod
metadata: {name: unsigned, namespace: develop}
spec: {containers: [{name: app, image: "ghcr.io/safeops-course/k8s-ai-monitor@sha256:91b7bb5d14deb880558ee5a78478525f4575a8fc549bcfe7e72c8f85486df3c5"}]}
---
apiVersion: v1
kind: Pod
metadata: {name: unsigned-init-container, namespace: staging}
spec:
  initContainers: [{name: init, image: "ghcr.io/safeops-course/k8s-ai-monitor@sha256:91b7bb5d14deb880558ee5a78478525f4575a8fc549bcfe7e72c8f85486df3c5"}]
  containers: [{name: app, image: "ghcr.io/safeops-course/backend@sha256:c531df33871e88a2fc8c51ad59ee0ec14e9cee4b65be628a98ef342dc017b7da"}]
---
apiVersion: v1
kind: Pod
metadata: {name: unsigned-in-observability, namespace: observability}
spec: {containers: [{name: app, image: "ghcr.io/safeops-course/k8s-ai-monitor@sha256:91b7bb5d14deb880558ee5a78478525f4575a8fc549bcfe7e72c8f85486df3c5"}]}
---
apiVersion: v1
kind: Pod
metadata: {name: frontend-mixed-formats, namespace: staging}
spec: {containers: [{name: app, image: "ghcr.io/safeops-course/frontend@sha256:3ac8955f8bb18eebce622bfda77fa415aba2ed009470dc154e087bef5d1390f4"}]}
