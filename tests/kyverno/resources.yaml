# Resources for tests/kyverno-policies.test.sh - one object per case, named after what it breaks.
# 'good' passes every policy. Pods are in develop, where the guardrails enforce.
---
apiVersion: v1
kind: Pod
metadata:
  name: good
  namespace: develop
spec:
  securityContext:
    runAsNonRoot: true
    seccompProfile:
      type: RuntimeDefault
  containers:
    - name: app
      image: ghcr.io/safeops-course/backend:develop-v0.0.0-abc1234-1791000000
      securityContext:
        allowPrivilegeEscalation: false
        capabilities:
          drop:
            - ALL
      resources:
        requests:
          cpu: 50m
          memory: 64Mi
        limits:
          cpu: 200m
          memory: 128Mi
---
