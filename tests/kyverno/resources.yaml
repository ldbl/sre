      resources:
        requests: {cpu: 50m, memory: 64Mi}
        limits: {cpu: 200m, memory: 128Mi}
---
# ...and a pod that breaks all five fails each audit copy (a PolicyReport entry, not a refusal).
apiVersion: v1
kind: Pod
metadata:
  name: bad-observability
  namespace: observability
spec:
  containers:
    - name: app
      image: nginx
      securityContext:
        privileged: true
