# The same checks through a CronJob: the pod spec sits three levels deeper (jobTemplate).
apiVersion: batch/v1
kind: CronJob
metadata:
  name: cronjob-latest
  namespace: develop
spec:
  schedule: "0 3 * * *"
  jobTemplate:
    spec:
      template:
        spec:
          restartPolicy: Never
          securityContext:
            runAsNonRoot: true
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: job
              image: busybox
              securityContext:
                allowPrivilegeEscalation: false
                capabilities:
                  drop:
                    - ALL
              resources:
                requests: {cpu: 10m, memory: 32Mi}
                limits: {cpu: 100m, memory: 64Mi}
---
# The excepted workload as a Deployment: the exception matches it by name prefix, so the Deployment
# and the pods it creates (vendor-agent-<hash>-<id>) are both let through.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: vendor-agent
  namespace: develop
spec:
  selector:
    matchLabels:
      app: vendor-agent
  template:
    metadata:
      labels:
        app: vendor-agent
    spec:
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: app
          image: quay.io/example/agent:1.0
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          resources:
            requests: {cpu: 50m, memory: 64Mi}
            limits: {cpu: 200m, memory: 128Mi}
---
# The same image under the same name prefix in another namespace: the exception names develop only.
apiVersion: v1
kind: Pod
metadata:
  name: vendor-agent-elsewhere
  namespace: staging
spec:
  securityContext:
