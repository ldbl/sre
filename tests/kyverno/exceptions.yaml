# A PolicyException the way flux/infrastructure/policy/exceptions/ holds them: one policy, one
# namespace, one workload by name (or name prefix), a native expiry. The test proves it turns that
# workload's failure into "skip" - and only that workload's: registry-untrusted (same image, other
# name) and vendor-agent-elsewhere (same prefix, other namespace) still fail.
apiVersion: policies.kyverno.io/v1
kind: PolicyException
metadata:
  name: vendor-agent-registry
  namespace: policy-exceptions
  annotations:
    safeops.io/owner: platform-team
    safeops.io/reason: "test fixture"
spec:
  expiresAt: "2099-01-01T00:00:00Z"
  policyRefs:
    - name: require-trusted-registries-enforce
      kind: ValidatingPolicy
  matchConditions:
    - name: one-workload
      expression: "object.metadata.namespace == 'develop' && object.metadata.name.startsWith('vendor-agent')"
