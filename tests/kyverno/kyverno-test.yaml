# Expected verdicts of the admission guardrails (flux/infrastructure/policy/packs/admission-guardrails).
# Run with tests/kyverno-policies.test.sh: it fills in ${image_registry} the way Flux does, then
# runs `kyverno test`. A policy not listed for a resource is not checked for it.
# Every guardrail is two ValidatingPolicies: <name>-enforce judges develop, staging and production,
# <name>-audit every other namespace (observability here); values.yaml gives the CLI the namespace
# labels the namespaceSelector reads.
apiVersion: cli.kyverno.io/v1alpha1
kind: Test
metadata:
  name: admission-guardrails
policies:
  - policies/disallow-latest-tag.yaml
  - policies/disallow-privileged-containers.yaml
  - policies/require-requests-limits.yaml
  - policies/require-security-context.yaml
  - policies/require-trusted-registries.yaml
resources:
  - resources.yaml
exceptions:
  - exceptions.yaml
variables: values.yaml
results:
  # The compliant pod passes all five.
  - {policy: disallow-latest-tag-enforce, kind: Pod, resources: [good], result: pass}
  - {policy: disallow-privileged-containers-enforce, kind: Pod, resources: [good], result: pass}
  - {policy: require-requests-limits-enforce, kind: Pod, resources: [good], result: pass}
  - {policy: require-security-context-enforce, kind: Pod, resources: [good], result: pass}
  - {policy: require-trusted-registries-enforce, kind: Pod, resources: [good], result: pass}

  # Tags: "latest" and no tag fail; a digest and pinned lab images pass; pod controllers are checked too.
  - {policy: disallow-latest-tag-enforce, kind: Pod, resources: [tag-latest, tag-missing], result: fail}
  - {policy: disallow-latest-tag-enforce, kind: Pod, resources: [tag-digest, lab-images], result: pass}
  - {policy: disallow-latest-tag-enforce, kind: Deployment, resources: [deploy-latest], result: fail}
  - {policy: disallow-latest-tag-enforce, kind: CronJob, resources: [cronjob-latest], result: fail}

  # Ephemeral containers (kubectl debug) are checked like the others.
  - {policy: disallow-latest-tag-enforce, kind: Pod, resources: [ephemeral-latest], result: fail}
  - {policy: require-trusted-registries-enforce, kind: Pod, resources: [ephemeral-untrusted], result: fail}

  # Registries: short and long Docker Hub names are the same image; other sources fail, init containers too.
  - {policy: require-trusted-registries-enforce, kind: Pod, resources: [lab-images, tag-digest], result: pass}
  - {policy: require-trusted-registries-enforce, kind: Pod, resources: [registry-untrusted, registry-dockerhub-other, registry-untrusted-init, vendor-agent-elsewhere], result: fail}

  # Privileged: in a container or an init container.
  - {policy: disallow-privileged-containers-enforce, kind: Pod, resources: [privileged, privileged-init], result: fail}

  # Security context: runAsNonRoot per pod or per container; missing, turned off, or escalation allowed fails.
  - {policy: require-security-context-enforce, kind: Pod, resources: [nonroot-per-container], result: pass}
  - {policy: require-security-context-enforce, kind: Pod, resources: [nonroot-missing, nonroot-turned-off, escalation-allowed], result: fail}

  # Requests and limits: in a container, or in an init container.
  - {policy: require-requests-limits-enforce, kind: Pod, resources: [resources-missing, resources-init-missing], result: fail}

  # The exception: skips exactly the workload it names - the pod and the Deployment of that name.
  - {policy: require-trusted-registries-enforce, kind: Pod, resources: [vendor-agent], result: skip}
  - {policy: require-trusted-registries-enforce, kind: Deployment, resources: [vendor-agent], result: skip}

  # Outside the application namespaces the audit copies judge, with the same verdicts.
  - {policy: disallow-latest-tag-audit, kind: Pod, resources: [good-observability], result: pass}
  - {policy: disallow-privileged-containers-audit, kind: Pod, resources: [good-observability], result: pass}
  - {policy: require-requests-limits-audit, kind: Pod, resources: [good-observability], result: pass}
  - {policy: require-security-context-audit, kind: Pod, resources: [good-observability], result: pass}
  - {policy: require-trusted-registries-audit, kind: Pod, resources: [good-observability], result: pass}
  - {policy: disallow-latest-tag-audit, kind: Pod, resources: [bad-observability], result: fail}
  - {policy: disallow-privileged-containers-audit, kind: Pod, resources: [bad-observability], result: fail}
  - {policy: require-requests-limits-audit, kind: Pod, resources: [bad-observability], result: fail}
  - {policy: require-security-context-audit, kind: Pod, resources: [bad-observability], result: fail}
  - {policy: require-trusted-registries-audit, kind: Pod, resources: [bad-observability], result: fail}
