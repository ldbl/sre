# promtool unit tests for flux/infrastructure/observability/kube-prometheus-stack/monitoring/
# platform-alerts.yaml and flux/infrastructure/progressive-delivery/develop/alerts.yaml (run by
# tests/platform-alerts.test.sh, which extracts the rules first).
rule_files:
  - platform.yaml
  - progressive-delivery.yaml
evaluation_interval: 1m
tests:
  # The Kyverno case of 2026-10-08: a restart every ten minutes, each one clean (no CrashLoopBackOff).
  # Next to it, containers that restarted twice and three times in the hour: not a loop - the
  # threshold is "more than three". Restart counters only take whole steps, as here. The staging
  # container had restarted before the hour, so increase() extrapolates its three to about 3.6 -
  # the case floor() in the rule is for.
  - interval: 10m
    input_series:
      - series: 'kube_pod_container_status_restarts_total{namespace="kyverno", pod="kyverno-reports-controller-0", container="controller"}'
        values: '0+1x12'
      - series: 'kube_pod_container_status_restarts_total{namespace="develop", pod="backend-0", container="backend"}'
        values: '0x5 1 2x6'
      - series: 'kube_pod_container_status_restarts_total{namespace="staging", pod="frontend-0", container="frontend"}'
        values: '5x4 6 7 8x7'
    alert_rule_test:
      - eval_time: 30m
        alertname: ContainerRestartingOften
        exp_alerts: []
      - eval_time: 90m
        alertname: ContainerRestartingOften
        exp_alerts:
          - exp_labels:
              severity: warning
              namespace: kyverno
              pod: kyverno-reports-controller-0
              container: controller
            exp_annotations:
              summary: "kyverno/kyverno-reports-controller-0 (controller) restarted 6 times in the last hour"
              description: >-
                A restart loop can look clean: each exit 0, the pod Running between restarts.
                kubectl -n kyverno logs kyverno-reports-controller-0 -c controller --previous
                shows why the last run ended; kubectl describe pod shows the last state's reason.

  # A platform component at one core for an hour fires after 15 minutes of rate window plus 30 of
  # `for`; the same in an application namespace, or a platform component at a fifth of a core, never.
  - interval: 1m
    input_series:
      - series: 'container_cpu_usage_seconds_total{namespace="kyverno", pod="kyverno-reports-controller-0", container="controller"}'
        values: '0+60x90'
      - series: 'container_cpu_usage_seconds_total{namespace="develop", pod="backend-0", container="backend"}'
        values: '0+120x90'
      - series: 'container_cpu_usage_seconds_total{namespace="observability", pod="prometheus-0", container="prometheus"}'
        values: '0+12x90'
    alert_rule_test:
      - eval_time: 30m
        alertname: PlatformComponentHighCPU
        exp_alerts: []
      - eval_time: 60m
        alertname: PlatformComponentHighCPU
        exp_alerts:
          - exp_labels:
              severity: warning
              namespace: kyverno
              pod: kyverno-reports-controller-0
            exp_annotations:
              summary: "kyverno/kyverno-reports-controller-0 has used 1.00 CPU cores for 30 minutes"
              description: >-
                Find what it is doing before giving it more: its logs, its own metrics, what changed
                in its configuration. Scaling a component that loops only makes the loop bigger.

  # Chapter 19: the synthetic traffic stops at minute 10. Five minutes later rate()[5m] is 0, and
  # after five more the alert fires - before a release would meet an analysis with no data.
  - interval: 1m
    input_series:
      - series: 'traefik_service_requests_total{service="develop-frontend-primary-8080@kubernetes", code="200"}'
        values: '0+120x10 1200x30'
    alert_rule_test:
      - eval_time: 9m
        alertname: CanaryAnalysisHasNoTraffic
        exp_alerts: []
      - eval_time: 25m
        alertname: CanaryAnalysisHasNoTraffic
        exp_alerts:
          - exp_labels:
              severity: warning
            exp_annotations:
              summary: "No requests reach the develop frontend - the canary analysis has nothing to measure"
              description: >-
                The next frontend release in develop will fail its checks with "no values" and be rolled
                back. Check the synthetic traffic: kubectl -n develop get deploy frontend-synthetic-traffic,
                and its requests (Traefik's metrics for develop-frontend).

  # No series at all - the module just switched on, or Traefik never scraped: still no traffic.
  - interval: 1m
    input_series:
      - series: 'up{job="observability/traefik"}'
        values: '1x20'
    alert_rule_test:
      - eval_time: 4m
        alertname: CanaryAnalysisHasNoTraffic
        exp_alerts: []
      - eval_time: 10m
        alertname: CanaryAnalysisHasNoTraffic
        exp_alerts:
          - exp_labels:
              severity: warning
            exp_annotations:
              summary: "No requests reach the develop frontend - the canary analysis has nothing to measure"
              description: >-
                The next frontend release in develop will fail its checks with "no values" and be rolled
                back. Check the synthetic traffic: kubectl -n develop get deploy frontend-synthetic-traffic,
                and its requests (Traefik's metrics for develop-frontend).

  # CanaryRolledBack reads the Canary's namespace from exported_namespace (Flagger's own pod is in
  # flagger-system). A failed analysis (2) fires; promoted (1) and running (0) do not.
  - interval: 1m
    input_series:
      - series: 'flagger_canary_status{namespace="flagger-system", exported_namespace="develop", name="frontend"}'
        values: '1x4 0x4 2x10'
    alert_rule_test:
      - eval_time: 6m
        alertname: CanaryRolledBack
        exp_alerts: []
      - eval_time: 12m
        alertname: CanaryRolledBack
        exp_alerts:
          - exp_labels:
              severity: warning
              exported_namespace: develop
              name: frontend
            exp_annotations:
              summary: "Canary develop/frontend was rolled back"
              description: >-
                The last release of frontend failed its analysis and the previous version
                still serves. Find out why before the next release: kubectl -n develop
                describe canary frontend (Events) - a failed check with no values means the
                analysis had no traffic to measure.

