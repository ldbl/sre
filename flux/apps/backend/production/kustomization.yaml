apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: production
namePrefix: ""
labels:
  - pairs:
      environment: production
    includeSelectors: true
    includeTemplates: true
resources:
  - ../base
  - image-policy.yaml
  - image-automation.yaml
  - hpa.yaml
  - pdb.yaml
images:
  - name: backend
    newName: ${image_registry}/backend
    newTag: production-v0.0.0-13f9e84-1791575727 # {"$imagepolicy": "production:backend:tag"}
patches:
  # The backend reads backend-secrets and app-postgres-app as env vars, once, at start. A rotation sets
  # this to the current UTC time (date -u +%FT%TZ) in the same pull request as the Secret - or, for the Terraform-made database password, in a
  # pull request right after it: the pod template changes, and Flux rolls the pods like any release
  # (one new pod Ready before an old one goes). Not `kubectl rollout restart` - Flux removes its
  # annotation on the next reconcile and, mid-rollout, keeps the old pods with the old value
  # (docs/credential-rotation.md).
  - patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: backend
      spec:
        template:
          metadata:
            annotations:
              safeops.io/secrets-rotated: "2026-09-26T00:00:00Z"
