apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: production
namePrefix: ""
labels:
  - pairs:
      environment: production
    includeSelectors: true
    includeTemplates: true
resources:
  - ../base
  - image-policy.yaml
  - image-automation.yaml
  - hpa.yaml
  - pdb.yaml
images:
  - name: backend
    newName: ${image_registry}/backend
    newTag: production-v0.0.0-a00f7ba-1773188261 # {"$imagepolicy": "production:backend:tag"}
patches:
  # Production gets at least what develop gets, and staging gets exactly this (pre-production
  # parity). scripts/check-app-resources.sh enforces both and the namespace quota budget.
  - patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/resources/requests/cpu
        value: "100m"
      - op: replace
        path: /spec/template/spec/containers/0/resources/requests/memory
        value: "128Mi"
      - op: replace
        path: /spec/template/spec/containers/0/resources/limits/cpu
        value: "250m"
      - op: replace
        path: /spec/template/spec/containers/0/resources/limits/memory
        value: "256Mi"
    target:
      kind: Deployment
      name: backend
