---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
spec:
  template:
    spec:
      containers:
      - name: frontend
        env:
        - name: ENVIRONMENT
          value: "development"
        - name: RANDOM_ERROR_RATE
          value: "0.3"
        - name: RELEASE_NOTE
          value: "lab19-healthy"
