apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: k8s-ai-monitor
  labels:
    app.kubernetes.io/name: k8s-ai-monitor
rules:
  - apiGroups: [""]
    resources:
      - pods
      - pods/log
      - events
      - namespaces
      - nodes
      - services
      - endpoints
      - persistentvolumeclaims
      - configmaps
    verbs: ["get", "list", "watch"]
  # No `secrets`: reading a Secret returns its contents, and a cluster-wide read would give the
  # monitor (which processes alerts, logs and LLM output) flux-system/sops-age, the backup keys and
  # every password. The checks work without it (k8s-ai-monitor#4).
  # No writes at all, Events included: the monitor reports to Slack, not to the cluster
  # (kopf's Event posting is turned off in its startup).
  - apiGroups: ["apps"]
    resources:
      - deployments
      - replicasets
      - statefulsets
      - daemonsets
    verbs: ["get", "list", "watch"]
  - apiGroups: ["batch"]
    resources:
      - jobs
      - cronjobs
    verbs: ["get", "list", "watch"]
  - apiGroups: ["autoscaling"]
    resources:
      - horizontalpodautoscalers
    verbs: ["get", "list", "watch"]
  - apiGroups: ["networking.k8s.io"]
    resources:
      - ingresses
    verbs: ["get", "list", "watch"]
  - apiGroups: ["cert-manager.io"]
    resources:
      - certificates
    verbs: ["get", "list", "watch"]
  - apiGroups: ["metrics.k8s.io"]
    resources:
      - pods
      - nodes
    verbs: ["get", "list"]
  - apiGroups: ["postgresql.cnpg.io"]
    resources:
      - clusters
      - backups
      - scheduledbackups
    verbs: ["get", "list", "watch"]
  - apiGroups: ["kustomize.toolkit.fluxcd.io"]
    resources:
      - kustomizations
    verbs: ["get", "list", "watch"]
  - apiGroups: ["helm.toolkit.fluxcd.io"]
    resources:
      - helmreleases
    verbs: ["get", "list", "watch"]
  - apiGroups: ["source.toolkit.fluxcd.io"]
    resources:
      - gitrepositories
      - helmrepositories
      - helmcharts
      - ocirepositories
    verbs: ["get", "list", "watch"]
  # The critical-endpoint scanner discovers routes from Traefik IngressRoutes.
  - apiGroups: ["traefik.io"]
    resources:
      - ingressroutes
    verbs: ["get", "list", "watch"]
  # kopf lists CRDs to resolve the Flux resources it watches; without it, a minute of
  # 403 retries at every start and no notice of CRDs installed later.
  - apiGroups: ["apiextensions.k8s.io"]
    resources:
      - customresourcedefinitions
    verbs: ["get", "list", "watch"]
