---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: kube-prometheus-stack
  namespace: observability
spec:
  interval: 30m
  timeout: 10m
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
  chart:
    spec:
      chart: kube-prometheus-stack
      version: "82.1.1"
      sourceRef:
        kind: HelmRepository
        name: prometheus-community
        namespace: observability
      interval: 12h
  values:
    # Prometheus configuration
    prometheus:
      prometheusSpec:
        retention: 7d
        retentionSize: "10GB"
        resources:
          requests:
            cpu: 100m
            memory: 256Mi
          limits:
            cpu: 500m
            memory: 512Mi
        storageSpec:
          volumeClaimTemplate:
            spec:
              accessModes: ["ReadWriteOnce"]
              resources:
                requests:
                  storage: 10Gi
        # Select every ServiceMonitor, PodMonitor and PrometheusRule in every namespace.
        # The *NilUsesHelmValues: false lines are what makes the empty selectors mean "all": with the
        # chart default (true) an empty selector silently becomes release=kube-prometheus-stack, and
        # our own backend ServiceMonitors and PrometheusRules were never scraped or loaded.
        serviceMonitorSelectorNilUsesHelmValues: false
        serviceMonitorSelector: {}
        serviceMonitorNamespaceSelector: {}
        podMonitorSelectorNilUsesHelmValues: false
        podMonitorSelector: {}
        podMonitorNamespaceSelector: {}
        ruleSelectorNilUsesHelmValues: false
        ruleSelector: {}
        ruleNamespaceSelector: {}

    # Grafana configuration
    grafana:
      enabled: true
      adminPassword: admin
      initChownData:
        enabled: false
      securityContext:
        fsGroup: 472
      persistence:
        enabled: true
        size: 5Gi
      resources:
        requests:
          cpu: 10m
          memory: 64Mi
        limits:
          cpu: 100m
          memory: 256Mi
      # Default dashboards
      defaultDashboardsEnabled: true
      defaultDashboardsTimezone: UTC
      # Grafana is accessed via kubectl port-forward
      ingress:
        enabled: false

    # Alertmanager: the path from a firing alert to a human. The chart's default config sends
    # everything to the "null" receiver (so kind stays quiet); receivers are added per cluster with
    # AlertmanagerConfig objects labelled alertmanagerconfig: safeops - on the platform:
    # flux/infrastructure/observability/alerting (Watchdog -> Healthchecks.io dead man's switch).
    alertmanager:
      enabled: true
      alertmanagerSpec:
        replicas: 1
        retention: 24h
        resources:
          requests:
            cpu: 10m
            memory: 32Mi
          limits:
            memory: 128Mi
        alertmanagerConfigSelector:
          matchLabels:
            alertmanagerconfig: safeops
        # Without this the operator adds a namespace="observability" matcher to every
        # AlertmanagerConfig route - and Watchdog has no namespace label, so it would never match.
        alertmanagerConfigMatcherStrategy:
          type: None

    # Prometheus Operator configuration
    prometheusOperator:
      resources:
        requests:
          cpu: 10m
          memory: 64Mi
        limits:
          cpu: 100m
          memory: 256Mi

    # Control-plane components neither cluster lets Prometheus scrape: kind binds etcd, the scheduler,
    # the controller manager and kube-proxy to localhost, and k3s (Hetzner) runs them inside one binary.
    # Scraping them only produced TargetDown and etcd alerts that fired at rest - noise that teaches
    # people to ignore alerts. Their health shows through the API server and the nodes.
    kubeEtcd:
      enabled: false
    kubeScheduler:
      enabled: false
    kubeControllerManager:
      enabled: false
    kubeProxy:
      enabled: false

    # Default rules: every alert must call for an action. The rules for the components above go with
    # them; KubeHpaMaxedOut fires for every HPA whose min equals its max - develop and staging run
    # that way on purpose (Chapter 09), so it would fire forever and mean nothing.
    defaultRules:
      rules:
        etcd: false
        kubeControllerManager: false
        kubeProxy: false
        kubeSchedulerAlerting: false
        kubeSchedulerRecording: false
      disabled:
        KubeHpaMaxedOut: true

    # Node exporter - collect node metrics
    nodeExporter:
      enabled: true

    # Kube-state-metrics - collect Kubernetes object metrics
    kubeStateMetrics:
      enabled: true
    kube-state-metrics:
      resources:
        requests:
          cpu: 10m
          memory: 32Mi
        limits:
          cpu: 100m
          memory: 128Mi

    # Additional scrape configs
    prometheus-node-exporter:
      resources:
        requests:
          cpu: 10m
          memory: 32Mi
        limits:
          cpu: 200m
          memory: 128Mi
