# Backend alerts besides the error budget (backend-slo-rules.yaml). Each one names an action:
#   BackendNoReadyPods     - nobody can be served in that environment: restore it now (critical)
#   BackendLatencyHigh     - users wait: find the slow route before it turns into errors (warning)
#   BackendNearMemoryLimit - a container is close to OOMKilled: a leak or a size (Chapter 08) (warning)
# Left out on purpose, because they ask for no action of their own:
#   - a scrape that fails (up == 0) is lost telemetry, not a down service: the default TargetDown
#     reports it, and BackendNoReadyPods covers the service itself;
#   - restarts: the default KubePodCrashLooping reports a pod that keeps restarting;
#     a single restart is not an incident;
#   - goroutine counts and other internals belong on the dashboard, for diagnosis.
---
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: backend-alerts
  namespace: observability
  labels:
    prometheus: kube-prometheus-stack
    role: alert-rules
spec:
  groups:
    - name: backend.rules
      interval: 30s
      rules:
        - alert: BackendNoReadyPods
          expr: kube_deployment_status_replicas_available{deployment="backend",namespace=~"develop|staging|production"} == 0
          for: 2m
          labels:
            severity: critical
            component: backend
          annotations:
            summary: "{{ $labels.namespace }}: no backend pod is ready - every request fails"
            description: "The backend Deployment in {{ $labels.namespace }} has no available replica for 2 minutes. First check: kubectl get pods -l app=backend in {{ $labels.namespace }} - the reason is in the pod status (CrashLoopBackOff, OOMKilled, ImagePullBackOff, Pending)."
            runbook_url: "https://safeops.work/members/chapter-11-observability/runbook-incident-debug/"

        - alert: BackendLatencyHigh
          expr: |
            backend:user_latency_p95:rate5m > 1
            and backend:user_requests:rate5m > 0.05
          for: 10m
          labels:
            severity: warning
            component: backend
          annotations:
            summary: "{{ $labels.namespace }}: backend p95 latency {{ $value | humanizeDuration }}"
            description: "One in twenty user requests to the backend in {{ $labels.namespace }} takes longer than 1s, for 10 minutes. First check: the slow route in the latency panel by path, then its trace (the database span or an outbound call)."
            runbook_url: "https://safeops.work/members/chapter-11-observability/runbook-incident-debug/"

        - alert: BackendNearMemoryLimit
          expr: |
            max by (namespace, pod) (
              container_memory_working_set_bytes{namespace=~"develop|staging|production",container="backend"}
              / on (namespace, pod, container)
              kube_pod_container_resource_limits{resource="memory",container="backend"}
            ) > 0.9
          for: 15m
          labels:
            severity: warning
            component: backend
          annotations:
            summary: "{{ $labels.namespace }}/{{ $labels.pod }}: backend at {{ $value | humanizePercentage }} of its memory limit"
            description: "The working set has stayed above 90% of the memory limit for 15 minutes; the next allocation may be OOMKilled. First check: does it level off (a size) or climb (a leak)? Chapter 08."
            runbook_url: "https://safeops.work/members/chapter-11-observability/runbook-incident-debug/"
