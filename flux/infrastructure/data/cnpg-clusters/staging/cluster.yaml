apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: app-postgres
  namespace: staging
  annotations:
    cnpg.io/validation: "disabled"
spec:
  instances: 1
  # Pinned to a minor and its digest: the major tag (:17) moved to every new PostgreSQL minor by
  # itself. Changing this restarts the instance once - with one instance, a short outage.
  # renovate: datasource=docker depName=ghcr.io/cloudnative-pg/postgresql
  imageName: ghcr.io/cloudnative-pg/postgresql:17.11@sha256:70664ebcfa1100361b5bdc28bbf06fdbe08db2dc4ad7bd14de33c5e05fe8ea8e
  primaryUpdateStrategy: unsupervised
  bootstrap:
    initdb:
      database: app
      owner: app
      secret:
        name: app-postgres-app
  storage:
    size: 20Gi
  backup:
    retentionPolicy: "14d"
    barmanObjectStore:
      destinationPath: s3://${BACKUP_S3_BUCKET}/cnpg-backups/staging/app-postgres
      endpointURL: ${BACKUP_S3_ENDPOINT}
      s3Credentials:
        accessKeyId:
          name: cnpg-backup-s3
          key: ACCESS_KEY_ID
        secretAccessKey:
          name: cnpg-backup-s3
          key: ACCESS_SECRET_KEY
  resources:
    requests:
      cpu: 10m
      memory: 128Mi
    limits:
      cpu: 100m
      memory: 512Mi
  # initdb sets the owner's password only once. managed.roles keeps the app role's password equal to
  # the app-postgres-app Secret on every reconcile, so rotating the Secret (SOPS or Terraform) rotates
  # the database password too. The backend reads POSTGRES_PASSWORD as an env var at start: after a
  # rotation, restart it (kubectl -n staging rollout restart deploy/backend) or new connections fail.
  managed:
    roles:
      - name: app
        ensure: present
        login: true
        passwordSecret:
          name: app-postgres-app
