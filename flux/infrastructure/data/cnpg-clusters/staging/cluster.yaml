apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: app-postgres
  namespace: staging
  annotations:
    cnpg.io/validation: "disabled"
spec:
  instances: 1
  # Pinned to a minor and its digest: the major tag (:17) moved to every new PostgreSQL minor by
  # itself. Changing this restarts the instance once - with one instance, a short outage.
  # The minimal Debian trixie image: the in-tree barman tools of the old "system" image are not needed
  # with the Barman Cloud plugin (its sidecar brings them).
  # A new MAJOR version here is an offline in-place upgrade: CNPG stops the instance and runs
  # pg_upgrade --link in a job - old and new image on the same distribution. Take a backup first; give
  # the archive a new serverName below in the same change (point-in-time restore does not cross major
  # versions); take a base backup right after (Chapter 12).
  # renovate: datasource=docker depName=ghcr.io/cloudnative-pg/postgresql
  imageName: ghcr.io/cloudnative-pg/postgresql:18.6-minimal-trixie@sha256:37ade18dbdddba430858c72725aceeec66f33fa5333e82ea1df4942f6c1c83a3
  primaryUpdateStrategy: unsupervised
  bootstrap:
    initdb:
      database: app
      owner: app
      secret:
        name: app-postgres-app
  storage:
    size: 20Gi
  # Base backups and the WAL archive go through the Barman Cloud plugin to the ObjectStore
  # app-postgres-backups (object-store.yaml); retention lives there too.
  plugins:
    - name: barman-cloud.cloudnative-pg.io
      isWALArchiver: true
      parameters:
        barmanObjectName: app-postgres-backups
        # One archive per major version: 17's backups and WAL stay under app-postgres and still restore
        # into a 17 cluster; 18 starts its own.
        serverName: app-postgres-pg18
  resources:
    requests:
      cpu: 10m
      memory: 128Mi
    limits:
      cpu: 100m
      memory: 512Mi
  # initdb sets the owner's password only once. managed.roles keeps the app role's password equal to
  # the app-postgres-app Secret on every reconcile, so rotating the Secret (SOPS or Terraform) rotates
  # the database password too. The backend reads POSTGRES_PASSWORD as an env var at start: after a
  # rotation, roll it through Git (safeops.io/secrets-rotated in flux/apps/backend/staging) or new
  # connections fail - not kubectl rollout restart, which Flux undoes (docs/credential-rotation.md).
  managed:
    roles:
      - name: app
        ensure: present
        login: true
        passwordSecret:
          name: app-postgres-app
