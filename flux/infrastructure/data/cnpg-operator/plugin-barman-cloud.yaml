# The Barman Cloud plugin: base backups and the WAL archive of every CloudNativePG cluster go through
# it (ObjectStore + spec.plugins in flux/infrastructure/data/cnpg-clusters/). It replaces the in-tree
# barmanObjectStore, deprecated since CNPG 1.26 and removed in 1.31. It must run in the operator's
# namespace. The operator talks to it over mTLS; the chart makes the certificates with its own
# self-signed cert-manager Issuer - so cert-manager runs on every cluster, kind included.
# https://cloudnative-pg.io/plugin-barman-cloud/docs/installation/
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: plugin-barman-cloud
  namespace: flux-system
spec:
  interval: 30m
  chart:
    spec:
      chart: plugin-barman-cloud
      version: "0.8.1" # plugin v0.15.1
      sourceRef:
        kind: HelmRepository
        name: cloudnative-pg
        namespace: flux-system
      interval: 30m
  targetNamespace: cnpg-system
  dependsOn:
    - name: cloudnative-pg
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
