# A privileged container has the host's devices and kernel capabilities - one escape from it is an
# escape from the node. Init containers are checked too: they run with the same privileges, only
# earlier. In the application namespaces Pod Security "restricted" (Chapter 07) refuses this as well;
# Kyverno adds the PolicyReport in the namespaces Pod Security does not restrict.
#
# Mode (Chapter 16): Enforce in the application namespaces, Audit everywhere else.
apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: disallow-privileged-containers
  annotations:
    policies.kyverno.io/title: Disallow Privileged Containers
    policies.kyverno.io/category: Pod Security
    policies.kyverno.io/severity: high
    policies.kyverno.io/description: >-
      Privileged containers have full access to the host. This policy
      blocks privileged mode to enforce workload isolation boundaries.
spec:
  background: true
  rules:
    - name: no-privileged
      match:
        any:
          - resources:
              kinds:
                - Pod
      validate:
        failureAction: Audit
        failureActionOverrides:
          - action: Enforce
            namespaces: [develop, staging, production]
        message: "Privileged containers (and init containers) are not allowed."
        pattern:
          spec:
            =(initContainers):
              - =(securityContext):
                  =(privileged): "false"
            containers:
              - =(securityContext):
                  =(privileged): "false"
