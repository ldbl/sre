# Only images from known sources may run: the platform's own registry, the CloudNativePG images and
# the three Docker Hub images the labs use. Everything else needs an exception through a pull request.
# The rule compares Kyverno's parsed references (`images`: registry + repository, without the tag),
# so `busybox:1.36` and `docker.io/library/busybox:1.36` are the same image - the one the runtime
# pulls. Docker Hub official images are listed one by one, not as docker.io/*: that would admit any
# Docker Hub account.
#
# Mode (Chapter 16): Enforce in the application namespaces, Audit everywhere else.
apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: require-trusted-registries
  annotations:
    policies.kyverno.io/title: Require Trusted Container Registries
    policies.kyverno.io/category: Supply Chain Security
    policies.kyverno.io/severity: high
    policies.kyverno.io/description: >-
      Only images from trusted sources may be admitted: ${image_registry}/*,
      ghcr.io/cloudnative-pg/* and the lab images busybox, postgres and curlimages/curl.
spec:
  background: true
  rules:
    - name: trusted-registries-only
      match:
        any:
          - resources:
              kinds:
                - Pod
      validate:
        failureAction: Audit
        failureActionOverrides:
          - action: Enforce
            namespaces: [develop, staging, production]
        message: >-
          Images must come from ${image_registry}/*, ghcr.io/cloudnative-pg/* or be one of the lab
          images (docker.io busybox, postgres, curlimages/curl). This pod uses:
          {{ images.[containers, initContainers][].*[] | [].join('/', [registry, trim_prefix(path, 'library/')]) }}
        deny:
          conditions:
            any:
              - key: "{{ images.[containers, initContainers][].*[] | [].join('/', [registry, trim_prefix(path, 'library/')]) }}"
                operator: AnyNotIn
                value:
                  - "${image_registry}/*"
                  - "ghcr.io/cloudnative-pg/*"
                  - "docker.io/busybox"
                  - "docker.io/postgres"
                  - "docker.io/curlimages/curl"
