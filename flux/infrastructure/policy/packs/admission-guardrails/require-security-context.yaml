      expression: variables.podSpec.?securityContext.?runAsNonRoot.orValue(false)
    # Every container (init containers included) that may run as root or escalate privileges.
    - name: weak
      expression: >-
        (variables.podSpec.containers + variables.podSpec.?initContainers.orValue([]))
        .filter(c, !c.?securityContext.?runAsNonRoot.orValue(variables.podNonRoot)
          || c.?securityContext.?allowPrivilegeEscalation.orValue(true)).map(c, c.name)
  validations:
    - expression: size(variables.weak) == 0
      messageExpression: >-
        'Containers must run as non-root (pod or container securityContext.runAsNonRoot: true) and set
        allowPrivilegeEscalation: false - init containers included. Not here: ' + variables.weak.join(', ')
