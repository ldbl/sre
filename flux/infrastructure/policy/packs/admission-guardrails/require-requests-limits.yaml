# Requests make scheduling honest, limits keep one container from starving its neighbours (Chapter 08).
# A Pod is checked after admission defaults are applied, so in a namespace with a LimitRange (all
# application namespaces have one) a pod without resources gets the defaults and passes; a Deployment
# has no LimitRange applied and must set them itself. Init containers are checked too; ephemeral
# containers cannot have resources and are not.
#
# Two copies, identical but for the name, the action, the failure policy and the namespace operator
# (tests/kyverno-policies.test.sh fails when they drift apart):
#   require-requests-limits-enforce  develop, staging, production - Deny, failurePolicy Fail
#   require-requests-limits-audit    every other namespace         - Audit (a PolicyReport), failurePolicy Ignore
# Exceptions: flux/infrastructure/policy/exceptions/, through a pull request.
apiVersion: policies.kyverno.io/v1
kind: ValidatingPolicy
metadata:
  name: require-requests-limits-enforce
  annotations:
    policies.kyverno.io/title: Require Resource Requests and Limits (enforce)
    policies.kyverno.io/category: Best Practices
    policies.kyverno.io/severity: medium
spec:
  validationActions: [Deny]
  failurePolicy: Fail
  evaluation:
    background:
      enabled: true
  matchConstraints:
    # Pods - and the controllers that create them, listed here instead of Kyverno's autogen: autogen
    # only works for a policy that matches pods alone, and kubectl debug's pods/ephemeralcontainers
    # must be matched too. A bad Deployment is refused at apply, not later when its pods are created.
    resourceRules:
      - apiGroups: [""]
        apiVersions: [v1]
        operations: [CREATE, UPDATE]
        resources: [pods, pods/ephemeralcontainers]
      - apiGroups: [apps]
        apiVersions: [v1]
        operations: [CREATE, UPDATE]
        resources: [deployments, statefulsets, daemonsets]
      - apiGroups: [batch]
        apiVersions: [v1]
        operations: [CREATE, UPDATE]
        resources: [jobs, cronjobs]
    namespaceSelector:
      matchExpressions:
        - key: kubernetes.io/metadata.name
          operator: In
          values: [develop, staging, production]
  variables:
    # The pod spec, wherever this kind keeps it.
    - name: podSpec
      expression: >-
        object.kind == 'Pod' ? object.spec
        : object.kind == 'CronJob' ? object.spec.jobTemplate.spec.template.spec
        : object.spec.template.spec
    # An UPDATE that leaves the spec as it was - a label, an annotation, a finalizer removed. It is let
    # through: ClusterPolicy did the same (allowExistingViolations), and refusing it would leave a pod
    # that already breaks the rule - one admitted before the rule, or under an exception that has since
    # expired - unable to get a label or lose a finalizer, stuck in Terminating. A changed spec, an
    # added ephemeral container and every CREATE are checked; the background scan still reports the
    # existing violation (it has no request, so this is false there).
    - name: metadataOnly
      expression: >-
        request.?operation.orValue('') == 'UPDATE' && oldObject != null && has(oldObject.spec)
        && object.spec == oldObject.spec
    # Every container (init containers included) without a CPU or memory request or limit.
    - name: missing
      expression: >-
        (variables.podSpec.containers + variables.podSpec.?initContainers.orValue([]))
        .filter(c, !['cpu', 'memory'].all(r,
          r in c.?resources.?requests.orValue({}) && r in c.?resources.?limits.orValue({}))).map(c, c.name)
  validations:
    - expression: variables.metadataOnly || size(variables.missing) == 0
      messageExpression: >-
        'CPU and memory requests and limits are required for all containers and init containers.
        Missing in: ' + variables.missing.join(', ')
---
