# A mutable tag ("latest", or no tag at all - the runtime pulls "latest" then) means the same manifest
# can run a different image tomorrow: no artifact identity, no reliable rollback (Chapter 10).
# The rule reads Kyverno's parsed image references (`images`), not the image string, so
# `curlimages/curl` without a tag is caught as "latest". An image pinned by digest has no tag to check.
#
# Mode (Chapter 16): Enforce in the application namespaces, Audit - a PolicyReport only - everywhere
# else. Exceptions: flux/infrastructure/policy/exceptions/, through a pull request.
apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: disallow-latest-tag
  annotations:
    policies.kyverno.io/title: Disallow Latest Tag
    policies.kyverno.io/category: Best Practices
    policies.kyverno.io/severity: medium
    policies.kyverno.io/description: >-
      Mutable image tags like 'latest' - or no tag, which means 'latest' - break artifact
      identity and make rollback unreliable. Require an immutable tag or a digest.
spec:
  background: true
  rules:
    - name: no-latest
      match:
        any:
          - resources:
              kinds:
                - Pod
      validate:
        failureAction: Audit
        failureActionOverrides:
          - action: Enforce
            namespaces: [develop, staging, production]
        message: >-
          Image tag 'latest' (or no tag) is not allowed - use an immutable tag or a digest.
          Tags without a digest here: {{ images.[containers, initContainers][].*[] | [?digest == null].tag }}
        deny:
          conditions:
            any:
              - key: "{{ images.[containers, initContainers][].*[] | [?digest == null].tag }}"
                operator: AnyIn
                value: ["latest"]
