# Chapter 17: every image from the platform's own registry (${image_registry}) must be signed - keyless,
# by the build.yml of its own repository (backend, frontend, k8s-ai-monitor) on main or develop - and
# carry an SPDX SBOM attestation signed the same way. Images from other registries are not this
# policy's business (Chapter 16's require-trusted-registries decides whether they may run at all).
#
# ImageValidatingPolicy (CEL), not a ClusterPolicy verifyImages rule: the CI signs with cosign v3,
# whose signatures are Sigstore bundles stored as OCI referrers; Kyverno's ClusterPolicy verifyImages
# finds none of them ("no signatures found"), the ImageValidatingPolicy verifies both the bundles and
# the older .sig format (checked with the Kyverno CLI 1.17 against the real images).
#
# Two copies, identical but for the name, the namespaces, the action and the failure policy -
# tests/kyverno-supply-chain.test.sh fails when they drift apart:
#   verify-images-enforce  develop, staging, production - Deny, failurePolicy Fail
#   verify-images-audit    every other namespace         - Audit (PolicyReports), failurePolicy Ignore
#
# Tags are verified as they resolve at admission. Pinning the verified digest into the pod
# (mutateDigest) is what closes the gap of a tag moved between admission and the pull - but Kyverno
# 1.17 does not implement it for ImageValidatingPolicy (pkg/cel/policies/ivpol/engine: added in
# 1.19.0); set to true, it silently does nothing and verifyDigest refuses nothing (checked on kind).
# So both are false here, explicitly: the gap is accepted tech debt until the Kyverno 1.19 upgrade.
apiVersion: policies.kyverno.io/v1
kind: ImageValidatingPolicy
metadata:
  name: verify-images-enforce
  annotations:
    policies.kyverno.io/title: Verify Image Signatures and SBOM (enforce)
    policies.kyverno.io/category: Supply Chain Security
    policies.kyverno.io/severity: high
spec:
  validationActions: [Deny]
  failurePolicy: Fail
  validationConfigurations:
    mutateDigest: false   # true from Kyverno 1.19 on - see the header
    verifyDigest: false
  # Verifying a signature and an SBOM costs about ten seconds when the result is not cached (ghcr.io,
  # Sigstore): on kind the default 10 s timeout cut every first verification off, and the pod was
  # refused although its image was signed. 30 s is the maximum; a verified digest is then cached
  # for an hour (Kyverno's image verify cache) and admission is fast.
  webhookConfiguration:
    timeoutSeconds: 30
  # Verified at admission only - the moment a pod's image is decided. A background scan re-verified
  # every image of every running pod (cosign signature + SBOM, against ghcr.io and Sigstore) on every
  # resync: on kind the reports controller averaged 1.3 cores, peaked at 6.6, lost its leader lease
  # under its own load and restarted - 49 times in 29 hours - each time scanning everything again.
  # A running pod's image does not change, so the re-check bought nothing. What it costs: a pod
  # admitted while Kyverno could not answer (the audit copy fails open) gets no report until it is
  # recreated; the enforce copy fails closed, so in develop/staging/production no such pod exists.
  evaluation:
    background:
      enabled: false
  autogen:
    podControllers:
      controllers: [deployments, statefulsets, daemonsets, jobs, cronjobs]
  matchConstraints:
    resourceRules:
      - apiGroups: [""]
        apiVersions: [v1]
        operations: [CREATE, UPDATE]
        resources: [pods]
    namespaceSelector:
      matchExpressions:
        - key: kubernetes.io/metadata.name
          operator: In
          values: [develop, staging, production]
  matchImageReferences:
    - glob: "${image_registry}/*"
  # One signer per repository: an image is verified against the workflow of the repository it is
  # named after - a backend image against backend's build.yml, not "any of the three". The single
  # regex this replaced admitted a backend image signed by the frontend's workflow.
  attestors:
    - name: backend
      cosign:
        keyless:
          identities:
            - issuer: "https://token.actions.githubusercontent.com"
              subjectRegExp: '^https://github\.com/${git_owner}/backend/\.github/workflows/build\.yml@refs/heads/(main|develop)$'
    - name: frontend
      cosign:
        keyless:
          identities:
            - issuer: "https://token.actions.githubusercontent.com"
              subjectRegExp: '^https://github\.com/${git_owner}/frontend/\.github/workflows/build\.yml@refs/heads/(main|develop)$'
    - name: guardian
      cosign:
        keyless:
          identities:
            - issuer: "https://token.actions.githubusercontent.com"
              subjectRegExp: '^https://github\.com/${git_owner}/k8s-ai-monitor/\.github/workflows/build\.yml@refs/heads/(main|develop)$'
  attestations:
    - name: sbom
      intoto:
        type: "https://spdx.dev/Document"
  variables:
    # Every container, init container and ephemeral container (kubectl debug) whose image is ours -
    # each image once (distinct): the backend's migrate initContainer runs the app's own image, and
    # verifying it twice per request (signature, then two SBOMs per image) took past the webhook's 30 s
    # on kind - every new backend pod was refused with a timeout.
    - name: ours
      expression: >-
        (images.?containers.orValue([]) + images.?initContainers.orValue([]) + images.?ephemeralContainers.orValue([]))
        .filter(image, image.startsWith('${image_registry}/')).distinct()
    # Which signer each repository of the registry has. A repository not listed has none, so its images
    # fail both checks (unsigned-demo, or anything pushed there by hand): the enforce copy refuses them,
    # the audit copy reports them.
    - name: signers
      expression: >-
        {'backend': attestors.backend, 'frontend': attestors.frontend, 'k8s-ai-monitor': attestors.guardian}
  validations:
    # The repository of an image: what follows the registry, up to the tag or digest.
    - expression: >-
        variables.ours.all(image,
          image.replace('${image_registry}/', '').split('@')[0].split(':')[0] in variables.signers
          && verifyImageSignatures(image, [variables.signers[image.replace('${image_registry}/', '').split('@')[0].split(':')[0]]]) > 0)
      message: "every ${image_registry} image must be signed by the build.yml of the repository it is named after (cosign, keyless)"
    - expression: >-
        variables.ours.all(image,
          image.replace('${image_registry}/', '').split('@')[0].split(':')[0] in variables.signers
          && verifyAttestationSignatures(image, attestations.sbom, [variables.signers[image.replace('${image_registry}/', '').split('@')[0].split(':')[0]]]) > 0)
      message: "every ${image_registry} image must carry an SPDX SBOM attestation signed by the build.yml of the repository it is named after"
