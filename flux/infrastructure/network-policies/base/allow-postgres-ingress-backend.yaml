apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-postgres-ingress-backend
spec:
  # app-postgres-restore: the side-by-side restore cluster (runbook, Chapter 12) needs the same
  # paths as the cluster it restores - or its recovery job hangs on a silently dropped connection.
  podSelector:
    matchExpressions:
      - key: cnpg.io/cluster
        operator: In
        values: [app-postgres, app-postgres-restore]
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchExpressions:
              - key: app
                operator: In
                values: [backend, backend-primary]
      ports:
        - protocol: TCP
          port: 5432
