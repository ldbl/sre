apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-frontend-egress-backend
spec:
  # frontend-primary: with the Chapter 19 canary (develop) Flagger relabels the serving pods
  # app=frontend-primary; they must still reach the backend.
  podSelector:
    matchExpressions:
      - key: app
        operator: In
        values: [frontend, frontend-primary]
  policyTypes:
    - Egress
  egress:
    - to:
        - podSelector:
            matchExpressions:
              - key: app
                operator: In
                values: [backend]
      ports:
        - protocol: TCP
          port: 8080
