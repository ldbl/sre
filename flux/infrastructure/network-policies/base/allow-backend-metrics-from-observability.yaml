apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-backend-metrics-from-observability
spec:
  # backend-primary: with Flagger (develop) the Service - and so Prometheus - reaches the primary
  # pods; allowing only app=backend blocked the scrape (context deadline exceeded).
  podSelector:
    matchExpressions:
      - key: app
        operator: In
        values: [backend, backend-primary]
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: observability
      ports:
        - protocol: TCP
          port: 8080
