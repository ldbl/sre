apiVersion: v1
kind: ResourceQuota
metadata:
  name: compute-quota
  namespace: production
spec:
  # limits.* must cover the worst case: every app at HPA maxReplicas + 1 surge pod of a rolling
  # update, plus the Postgres instances. scripts/check-app-resources.sh computes it from the
  # rendered manifests and fails when it does not fit (2Gi was exactly full before the backend got
  # the same 256Mi limit as develop). Production's second Postgres instance (Chapter 22) adds 128Mi
  # of requests and 512Mi of limits with its backup sidecar: 1Gi / 3Gi were then too small.
  hard:
    requests.cpu: "1"
    requests.memory: 1536Mi
    limits.cpu: "3"
    limits.memory: 4Gi
    pods: "15"
