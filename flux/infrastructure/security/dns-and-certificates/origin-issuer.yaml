---
# Issues origin certificates for every Ingress through Cloudflare's Origin CA. Works only behind the
# Cloudflare proxy (cluster-config cloudflare_proxied=enabled, zone SSL mode "Full (strict)"): a browser
# reaching the origin directly would not trust these certificates.
# Token: Cloudflare API token "Zone / SSL and Certificates / Edit" for safeops.work, SOPS secret
# cert-manager/cloudflare-origin-ca-token (flux/secrets/cloudflare).
apiVersion: cert-manager.k8s.cloudflare.com/v1
kind: ClusterOriginIssuer
metadata:
  name: cloudflare-origin-ca
spec:
  requestType: OriginECC
  auth:
    tokenRef:
      name: cloudflare-origin-ca-token
      key: api-token
