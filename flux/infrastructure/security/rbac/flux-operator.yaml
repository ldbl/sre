---
# Admins may suspend, resume and reconcile Flux during an incident (flux suspend/resume/reconcile
# patch the Kustomization or HelmRelease). Sources stay read-only: patching a GitRepository points
# Flux at another branch - the Chapter 01 incident - and needs the break-glass kubeconfig.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: oidc-flux-operator
rules:
  - apiGroups: ["kustomize.toolkit.fluxcd.io"]
    resources:
      - kustomizations
    verbs: ["patch"]
  - apiGroups: ["helm.toolkit.fluxcd.io"]
    resources:
      - helmreleases
    verbs: ["patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: oidc-flux-operator
  namespace: flux-system
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: oidc-flux-operator
subjects:
  - kind: Group
    name: "safeops-course:admins"
    apiGroup: rbac.authorization.k8s.io
