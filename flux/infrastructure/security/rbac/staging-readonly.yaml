---
# staging is the last step before production (promotion retags what was tested here), so it is
# read-only like production; changes come through Git.
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: oidc-readonly
  namespace: staging
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: oidc-restricted-readonly
subjects:
  - kind: Group
    name: "safeops-course:members"
    apiGroup: rbac.authorization.k8s.io
  - kind: Group
    name: "safeops-course:admins"
    apiGroup: rbac.authorization.k8s.io
