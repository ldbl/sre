apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: flagger
  namespace: flux-system
spec:
  interval: 30m
  chart:
    spec:
      chart: flagger
      version: "1.45.0"
      sourceRef:
        kind: HelmRepository
        name: flagger
        namespace: flux-system
      interval: 12h
  targetNamespace: flagger-system
  install:
    createNamespace: false
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
  values:
    crd:
      create: true
    meshProvider: traefik
    metricsServer: http://kube-prometheus-stack-prometheus.observability:9090
    # Flagger's own metrics (flagger_canary_status, flagger_canary_weight): the alert that a canary
    # was rolled back reads them - a release rejected without anyone noticing is this chapter's story.
    podMonitor:
      enabled: true
