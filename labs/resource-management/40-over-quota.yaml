# Chapter 08 lab: a Deployment that asks for more CPU than the namespace quota allows.
# The lab quota (flux/infrastructure/lab/resourcequota.yaml) caps the sum of CPU requests at 1 core;
# this pod asks for 2. The API server accepts the Deployment - the quota checks pods, not
# Deployments - and the ReplicaSet's attempts to create the pod are refused. The refusal is a
# FailedCreate event on the ReplicaSet ("exceeded quota: compute-quota"); the Deployment only shows
# 0/1 ready. The same happens in develop/staging/production.
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: greedy
  namespace: lab
spec:
  replicas: 1
  selector:
    matchLabels:
      app: greedy
  template:
    metadata:
      labels:
        app: greedy
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: greedy
          image: busybox:1.36
          command: ["sh", "-c", "while true; do sleep 3600; done"]
          resources:
            requests:
              cpu: "2"
              memory: 32Mi
            limits:
              cpu: "2"
              memory: 32Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
