# Chapter 08 lab: the same memory hog with requests lower than limits - the QoS class is Burstable.
# The scheduler reserves only the requests (32Mi, 10m) on the node; the container may use up to its
# limits (64Mi, 100m). It still dies at 64Mi with OOMKilled - the limit is a hard wall for every
# class. What Burstable changes is the node-level story: when a node runs out of memory, the kubelet
# evicts BestEffort pods first, then Burstable pods that use more than they requested, and
# Guaranteed pods last.
---
apiVersion: v1
kind: Pod
metadata:
  name: hog-burstable
  namespace: lab
spec:
  restartPolicy: Never
  automountServiceAccountToken: false
  securityContext:
    runAsNonRoot: true
    runAsUser: 65532
    runAsGroup: 65532
    seccompProfile:
      type: RuntimeDefault
  containers:
    - name: hog
      image: busybox:1.36
      command: ["sh", "-c", "x=a; while true; do x=$x$x; done"]
      resources:
        requests:
          cpu: 10m
          memory: 32Mi
        limits:
          cpu: 100m
          memory: 64Mi
      securityContext:
        allowPrivilegeEscalation: false
        readOnlyRootFilesystem: true
        capabilities:
          drop: ["ALL"]
