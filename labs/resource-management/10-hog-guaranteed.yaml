# Chapter 08 lab: a pod that keeps asking for memory until the kernel kills it.
# requests == limits for both CPU and memory, so the QoS class is Guaranteed. The shell doubles a
# string on every turn of the loop (1, 2, 4 ... bytes), so it crosses the 64Mi limit in seconds.
# When it does, the kernel's OOM killer ends the process with SIGKILL: exit code 137 (128 + 9) and
# reason OOMKilled in the container status. restartPolicy: Never keeps the dead pod, so the reason
# can be read - delete the pod yourself when done (a restarting pod would show CrashLoopBackOff).
# Guaranteed does not protect a pod from its own limit: the class only decides who is evicted first
# when the whole node runs short (20-hog-burstable.yaml dies the same way).
---
apiVersion: v1
kind: Pod
metadata:
  name: hog-guaranteed
  namespace: lab
spec:
  restartPolicy: Never
  automountServiceAccountToken: false
  securityContext:
    runAsNonRoot: true
    runAsUser: 65532
    runAsGroup: 65532
    seccompProfile:
      type: RuntimeDefault
  containers:
    - name: hog
      image: busybox:1.36
      command: ["sh", "-c", "x=a; while true; do x=$x$x; done"]
      resources:
        requests:
          cpu: 100m
          memory: 64Mi
        limits:
          cpu: 100m
          memory: 64Mi
      securityContext:
        allowPrivilegeEscalation: false
        readOnlyRootFilesystem: true
        capabilities:
          drop: ["ALL"]
