# Chapter 09 lab: two replicas and a PodDisruptionBudget that allows no voluntary disruption.
# minAvailable: 2 with two pods means ALLOWED DISRUPTIONS 0: the Eviction API - which kubectl drain
# uses for every pod - refuses to evict either pod ("Cannot evict pod as it would violate the pod's
# disruption budget", HTTP 429). A drain of their node would retry until its timeout.
# The PDB guards evictions only. Deleting a pod, a rolling update or a crash are not evictions, and
# the budget does not stop them (a rolling update follows the Deployment's strategy instead).
# 20-steady-pdb-one.yaml replaces this PDB with minAvailable: 1.
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: steady
  namespace: lab
spec:
  replicas: 2
  selector:
    matchLabels:
      app: steady
  template:
    metadata:
      labels:
        app: steady
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: steady
          image: busybox:1.36
          command: ["sh", "-c", "while true; do sleep 3600; done"]
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 50m
              memory: 32Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: steady
  namespace: lab
spec:
  minAvailable: 2
  selector:
    matchLabels:
      app: steady
