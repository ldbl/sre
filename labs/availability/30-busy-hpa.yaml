# Chapter 09 lab: an HPA that can actually scale.
# The container spins and uses its whole CPU limit (100m) - five times its request (20m). The HPA
# compares usage with the *request*: 500% against a 50% target, so it scales the Deployment up to its
# maxReplicas of 3 within a minute or two. The first readings may fail ("no metrics returned from
# resource metrics API") until metrics-server has measured the new pods.
# The Deployment sets no spec.replicas: the HPA owns the count, as on the platform
# (scripts/check-app-security.sh refuses replicas in Git for a Deployment with an HPA).
# Scaling down waits for a 5-minute stabilization window - the lab deletes it instead.
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: busy
  namespace: lab
spec:
  selector:
    matchLabels:
      app: busy
  template:
    metadata:
      labels:
        app: busy
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: busy
          image: busybox:1.36
          command: ["sh", "-c", "while true; do :; done"]
          resources:
            requests:
              cpu: 20m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 32Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: busy
  namespace: lab
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: busy
  minReplicas: 1
  maxReplicas: 3
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 50
