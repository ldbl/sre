# Chapter 06 lab: the one connection the lab needs - pods labelled app=lab-client to lab-api on TCP
# 8080, and nothing else. Two policies, because both ends are isolated by the default deny:
#   - ingress on lab-api: who may connect, and on which port;
#   - egress on lab-client: where it may connect.
# The port is the container port (8080), not the Service port (80): policies see the traffic after
# the Service has forwarded it to the pod.
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-lab-api-ingress-from-client
  namespace: lab
spec:
  podSelector:
    matchLabels:
      app: lab-api
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: lab-client
      ports:
        - protocol: TCP
          port: 8080
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-client-egress-to-lab-api
  namespace: lab
spec:
  podSelector:
    matchLabels:
      app: lab-client
  policyTypes:
    - Egress
  egress:
    - to:
        - podSelector:
            matchLabels:
              app: lab-api
      ports:
        - protocol: TCP
          port: 8080
