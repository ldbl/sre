# Chapter 06 lab: let every pod in "lab" ask the cluster DNS (CoreDNS in kube-system) - and nothing
# else. Without it a default deny also stops name lookups on most network plugins, and every
# connection fails before it starts. The platform has the same policy in each environment
# (flux/infrastructure/network-policies/base/allow-dns-egress.yaml).
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-dns-egress
  namespace: lab
spec:
  podSelector: {}
  policyTypes:
    - Egress
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
