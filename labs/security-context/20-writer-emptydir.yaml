# Chapter 07 lab: the same pod with the fix - an emptyDir mounted at /tmp, with a size limit.
# The write to /tmp succeeds; everything else stays as it was: the root filesystem is still
# read-only (the write to /etc fails), the process is still not root, and there is no service
# account token in the container (automountServiceAccountToken: false). The sizeLimit keeps a
# runaway write from filling the node's disk: past 16Mi, only this pod is evicted.
---
apiVersion: v1
kind: Pod
metadata:
  name: writer
  namespace: lab
spec:
  restartPolicy: Never
  automountServiceAccountToken: false
  securityContext:
    runAsNonRoot: true
    runAsUser: 65532
    runAsGroup: 65532
    seccompProfile:
      type: RuntimeDefault
  containers:
    - name: writer
      image: busybox:1.36
      command:
        - sh
        - -c
        - |
          echo report > /tmp/report.txt && echo "written: /tmp/report.txt"
          (echo x > /etc/report.txt) 2>/dev/null && echo "/etc: WRITABLE" || echo "/etc: read-only, as it should be"
          echo "uid: $(id -u)"
          [ -e /var/run/secrets/kubernetes.io/serviceaccount/token ] && echo "token: PRESENT" || echo "token: none"
      securityContext:
        allowPrivilegeEscalation: false
        readOnlyRootFilesystem: true
        capabilities:
          drop: ["ALL"]
      volumeMounts:
        - name: tmp
          mountPath: /tmp
  volumes:
    - name: tmp
      emptyDir:
        sizeLimit: 16Mi
