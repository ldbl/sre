name: Credential rotation

# docs/credential-registry.yaml records when each credential was last replaced. scripts/check-credentials.sh
# fails two weeks before a rotation is due - in pre-commit and on every pull request. But a date
# passes without a commit: with no pull request, nothing would run the check and nothing would say
# that a token is due. This runs it on main every morning; a due or overdue credential fails the run.
# GitHub e-mails a failed scheduled run to the person who last changed the cron line below (at first,
# whoever added this file) - not to every maintainer; and it disables scheduled workflows in a public
# repository after 60 days without activity. The fix is the rotation (docs/credential-rotation.md)
# and a pull request that sets the new date (Chapter 21).

on:
  schedule:
    - cron: "23 6 * * *"   # every day, 06:23 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rotation:
    # SafeOps' own credentials: in a fork this would fail every morning over dates its owner cannot
    # change (GitHub runs scheduled workflows in forks once they are enabled there).
    if: github.repository == 'safeops-course/sre'
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    steps:
      - name: Checkout main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # yq (v4) is on GitHub's ubuntu runners; the script needs nothing else.
      - name: Due or overdue credentials fail the run
        run: |
          yq --version
          scripts/check-credentials.sh
