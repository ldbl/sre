name: Policy exceptions expiry

# A PolicyException's safeops.io/expires date is checked by scripts/check-policy-exceptions.sh in
# pre-commit and on every pull request - but an exception that is already applied stays active after
# that date: nothing in the cluster reads the annotation, and Flux would recreate a deleted exception
# from Git anyway. Without a pull request, nothing ran the check and nothing said the date had passed.
# This runs the same check on main every morning: an expired exception fails the run. GitHub e-mails
# a failed scheduled run to the person who last changed the cron line below - not to every maintainer;
# and it disables scheduled workflows in a public repository after 60 days without activity. The fix
# is a pull request that removes the exception - or renews it, saying why (Chapter 16).

on:
  schedule:
    - cron: "17 6 * * *"   # every day, 06:17 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  expiry:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout main
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      # yq (v4) is on GitHub's ubuntu runners; the script needs nothing else.
      - name: Expired or over-long exceptions fail the run
        run: |
          yq --version
          scripts/check-policy-exceptions.sh
