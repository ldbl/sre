name: Policy exceptions expiry

# A PolicyException's spec.expiresAt is checked by scripts/check-policy-exceptions.sh in pre-commit
# and on every pull request. Kyverno stops applying an exception at that moment - but the file stays
# in Git and says it is in force, and without a pull request nothing said the date had passed.
# This runs the same check on main every morning: an expired exception fails the run. GitHub e-mails
# a failed scheduled run to the person who last changed the cron line below - not to every maintainer;
# and it disables scheduled workflows in a public repository after 60 days without activity. The fix
# is a pull request that removes the exception - or renews it, saying why (Chapter 16).

on:
  schedule:
    - cron: "17 6 * * *"   # every day, 06:17 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  expiry:
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    steps:
      - name: Checkout main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # yq (v4) is on GitHub's ubuntu runners; the script needs nothing else.
      - name: Expired or over-long exceptions fail the run
        run: |
          yq --version
          scripts/check-policy-exceptions.sh
