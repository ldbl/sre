name: unsigned-demo

# Builds labs/supply-chain/unsigned-demo and pushes ghcr.io/<owner>/unsigned-demo:<version> -
# deliberately WITHOUT a signature, an SBOM or provenance (Chapter 17: the image the supply-chain
# policy must refuse). Only in the course's own repository: a fork has no use for its own copy, and the
# lab and the policy test use the course's image.
# Re-run it only for a new version: an existing tag is never overwritten (the push step refuses).

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "labs/supply-chain/unsigned-demo/**"
      - ".github/workflows/unsigned-demo.yml"

permissions:
  contents: read

# One run at a time: two runs could both pass the "does it exist" check below and both push.
# Queued, never cancelled - a cancelled run could stop between the check and the push.
concurrency:
  group: unsigned-demo
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/unsigned-demo
  VERSION: "1.0"

jobs:
  build:
    if: github.repository == 'safeops-course/sre'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write   # push to ghcr.io (and list its versions) - no id-token, so this job cannot sign
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to ghcr.io
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # The tag is immutable by convention here: a second push of the same version would change what
      # the lab and the test point at. Asked through the GitHub Packages API, which answers 404 when the
      # package does not exist yet - any other error (auth, rate limit, an outage) fails the job instead
      # of being read as "missing" and pushing over an existing tag.
      - name: Refuse to overwrite an existing version
        env:
          GH_TOKEN: ${{ github.token }}
          OWNER: ${{ github.repository_owner }}
        run: |
          set -euo pipefail
          if ! tags="$(gh api --paginate "/orgs/${OWNER}/packages/container/unsigned-demo/versions" \
                --jq '.[].metadata.container.tags[]' 2>err.txt)"; then
            if grep -q "HTTP 404" err.txt; then
              echo "unsigned-demo does not exist yet - first push"
              exit 0
            fi
            cat err.txt >&2
            echo "::error::could not list the versions of unsigned-demo - refusing to push blind"
            exit 1
          fi
          if grep -qx "${VERSION}" <<<"${tags}"; then
            echo "::error::${IMAGE}:${VERSION} already exists - raise VERSION for a new image"
            exit 1
          fi

      - name: Build and push (unsigned on purpose)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: labs/supply-chain/unsigned-demo
          platforms: linux/amd64,linux/arm64
          push: true
          provenance: false   # no attestation of any kind - that is the point
          sbom: false
          tags: ${{ env.IMAGE }}:${{ env.VERSION }}

      - name: Summary
        run: |
          digest="$(docker buildx imagetools inspect "${IMAGE}:${VERSION}" --format '{{json .Manifest}}' | jq -r .digest)"
          {
            echo "## unsigned-demo"
            echo "\`${IMAGE}:${VERSION}\` - \`${digest}\` - deliberately unsigned"
          } >> "$GITHUB_STEP_SUMMARY"
