name: Renovate (dependency dashboard)

# Dependency updates on our own schedule (Chapter 20). Renovate reads the repository and keeps one
# issue - "Platform maintenance: dependency updates" - listing every pinned version that has a newer
# release: Helm charts in HelmReleases, Terraform providers and modules, GitHub Actions, and the
# versions under a '# renovate:' comment (k3s, kind's node image, Flux, the CI tools). It opens no
# pull requests (dependencyDashboardApproval in renovate.json): the update is made by hand, in one
# pull request, after the release notes - a version that moves by itself is what this chapter avoids.
#
# Monthly, and by hand (Actions -> Run workflow). On a pull request that changes the configuration it
# only looks up versions (dry run) and prints them: the config is checked, nothing is written.

on:
  schedule:
    - cron: "17 5 1 * *"   # the 1st of every month - the maintenance reminder
  workflow_dispatch:
  pull_request:
    paths:
      - renovate.json
      - .github/workflows/renovate.yml

permissions:
  contents: read
  issues: write          # the dependency dashboard is an issue

concurrency:
  group: renovate
  cancel-in-progress: false

jobs:
  renovate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Renovate
        uses: renovatebot/github-action@230ce922b08968d0a4f6f70f295601daff09ef1d # v46.3.7
        with:
          renovate-version: 44.149.2
          configurationFile: renovate.json
          token: ${{ secrets.GITHUB_TOKEN }}
        env:
          RENOVATE_REPOSITORIES: ${{ github.repository }}
          RENOVATE_ONBOARDING: "false"
          RENOVATE_REQUIRE_CONFIG: optional
          # A pull request only checks the configuration: look versions up on the pull request's own
          # branch (Renovate reads the default branch otherwise), write nothing, and log what it found.
          RENOVATE_DRY_RUN: ${{ github.event_name == 'pull_request' && 'lookup' || '' }}
          RENOVATE_BASE_BRANCH_PATTERNS: ${{ github.event_name == 'pull_request' && format('["{0}"]', github.head_ref) || '' }}
          LOG_LEVEL: ${{ github.event_name == 'pull_request' && 'debug' || 'info' }}
