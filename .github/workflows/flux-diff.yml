name: Flux Diff

on:
  pull_request:
    # The manifests, and everything that checks them: a change to a check must prove itself here too.
    paths:
      - "flux/**"
      - "scripts/flux-kustomize-validate.sh"
      - "scripts/check-app-security.sh"
      - "scripts/check-app-resources.sh"
      - "scripts/check-oidc-rbac.sh"
      - ".github/workflows/flux-diff.yml"

permissions:
  contents: read
  pull-requests: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Flux CLI
        uses: fluxcd/flux2/action@main

      - name: Setup kubeconform
        run: |
          KUBECONFORM_VERSION="v0.6.7"
          curl -sLO "https://github.com/yannh/kubeconform/releases/download/${KUBECONFORM_VERSION}/kubeconform-linux-amd64.tar.gz"
          tar xzf kubeconform-linux-amd64.tar.gz
          chmod +x kubeconform && sudo mv kubeconform /usr/local/bin/
          rm kubeconform-linux-amd64.tar.gz

      # Rules the apps must keep (security review 2026-09-27): no ServiceAccount token, pprof off,
      # chaos off in production. kubectl and yq come with the ubuntu runner.
      - name: App security rules
        run: scripts/check-app-security.sh

      # staging = production >= develop, and the worst case (HPA max + surge + Postgres) fits the quota.
      - name: App resources and quota budget
        run: scripts/check-app-resources.sh

      # Groups are Dex org:team groups (the bare org is never sent); write roles only in develop.
      - name: OIDC RBAC rules
        run: scripts/check-oidc-rbac.sh

      # The same script as the pre-commit hook, on the whole flux/ tree: every kustomization is built
      # (kubectl kustomize) and validated against the Kubernetes and Flux CRD schemas (kubeconform,
      # installed above). Locally kubeconform is optional, so this is where a schema error is
      # guaranteed to fail - it blocks the merge.
      - name: Build and validate kustomizations
        id: validate
        run: |
          set -uo pipefail
          # GitHub runs this with `bash -e`: without set +e a failing validator would end the step
          # here, before the errors are written to the outputs the PR comment reads.
          set +e
          scripts/flux-kustomize-validate.sh 2>&1 | tee /tmp/validate.log
          status=${PIPESTATUS[0]}
          set -e
          if [ "$status" -ne 0 ]; then
            {
              echo "build_errors<<EOF"
              # || true: no matching line must not end the step before the closing EOF is written
              grep -E 'FAILED|required tool missing|failed to prepare' /tmp/validate.log | head -50 || true
              echo "EOF"
            } >> "$GITHUB_OUTPUT"
            echo "result=failure" >> "$GITHUB_OUTPUT"
            exit 1
          fi
          echo "result=success" >> "$GITHUB_OUTPUT"

      - name: Comment on PR
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          RESULT: ${{ steps.validate.outputs.result }}
          BUILD_ERRORS: ${{ steps.validate.outputs.build_errors }}
        run: |
          HEADER="<!-- flux-diff -->"
          if [ "$RESULT" = "success" ]; then
            BODY="${HEADER}
          ## Flux Kustomize Validation

          **Result:** All kustomizations build and pass the schema check"
          else
            BODY="${HEADER}
          ## Flux Kustomize Validation

          **Result:** Build failures detected

          **Errors:**
          ${BUILD_ERRORS}"
          fi

          # Find existing comment
          COMMENT_ID=$(gh api "repos/${{ github.repository }}/issues/${PR_NUMBER}/comments" \
            --jq ".[] | select(.body | startswith(\"${HEADER}\")) | .id" 2>/dev/null | head -1)

          if [ -n "$COMMENT_ID" ]; then
            gh api "repos/${{ github.repository }}/issues/comments/${COMMENT_ID}" \
              -X PATCH -f body="$BODY"
          else
            gh api "repos/${{ github.repository }}/issues/${PR_NUMBER}/comments" \
              -f body="$BODY"
          fi
